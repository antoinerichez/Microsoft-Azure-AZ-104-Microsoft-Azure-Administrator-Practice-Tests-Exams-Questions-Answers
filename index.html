<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AZ-104 Practice Quiz</title>
  <style>
:root {
  --primary: #0078d4;
  --primary-dark: #005a9e;
  --bg: #f3f7fb;
  --panel: #ffffff;
  --border: #dfeaf4;
  --text: #1a1a1a;
  --muted: #616b75;
  --success: #2e7d32;
  --success-soft: #e8f5e9;
  --danger: #c62828;
  --danger-soft: #fdecea;
  --warning: #f5a623;
  --shadow: 0 12px 30px rgba(0, 98, 176, 0.12);
}
* { box-sizing: border-box; }
html, body { margin: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); }
body { min-height: 100vh; }
button { font: inherit; }
.app-shell { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
.topbar { background: linear-gradient(135deg, #005ea6, #0078d4); color: #fff; padding: 18px 22px; border-radius: 18px; box-shadow: var(--shadow); }
.topbar h1 { margin: 0; font-size: clamp(1.5rem, 2vw, 2.2rem); }
.topbar .meta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; color: rgba(255,255,255,.9); font-size: .94rem; }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }
.screen { display: none; }
.screen.active { display: block; }

.start-panel { padding: 28px; }
.mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-top: 22px; }
.mode-card {
  border: 2px solid var(--border); border-radius: 16px; background: #f9fbff; padding: 22px; cursor: pointer; transition: .2s ease; text-align: left;
}
.mode-card:hover { border-color: var(--primary); transform: translateY(-2px); }
.mode-card strong { display: block; font-size: 1.1rem; margin-bottom: 6px; }
.mode-card span { color: var(--muted); }
.mode-card.primary { border-color: var(--primary); background: #eef7ff; }
.start-actions { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; }
.primary-button, .secondary-button, .ghost-button {
  border: none; border-radius: 10px; padding: 12px 18px; font-weight: 600; cursor: pointer; transition: .2s ease;
}
.primary-button { background: var(--primary); color: white; }
.primary-button:hover { background: var(--primary-dark); }
.secondary-button { background: var(--success-soft); color: var(--success); }
.secondary-button:hover { background: #d7f0d9; }
.ghost-button { background: #eef3f8; color: var(--text); }
.ghost-button:hover { background: #e2ebf5; }

.quiz-panel { padding: 20px 18px 14px; }
.header-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.header-row .title { font-size: 1.1rem; font-weight: 700; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: #eef7ff; color: var(--primary-dark); font-weight: 600; }
.progress-wrap { margin-bottom: 18px; }
.progress-meta { display: flex; justify-content: space-between; color: var(--muted); margin-bottom: 8px; font-size: .92rem; }
.progress-bar { height: 12px; border-radius: 999px; background: #e6eef7; overflow: hidden; }
.progress-bar > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #0078d4, #5aa7f4); border-radius: inherit; transition: width .25s ease; }
.question-card { padding: 16px 18px 10px; background: #fff; border: 1px solid var(--border); border-radius: 14px; }
.question-text { font-size: clamp(1.1rem, 1.6vw, 1.45rem); line-height: 1.5; margin: 0 0 18px; }
.image-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 16px; }
.image-grid img { width: 100%; border-radius: 12px; border: 1px solid var(--border); background: #f6f9fc; }
.option-list { display: grid; gap: 10px; }
.option-button {
  width: 100%; text-align: left; border: 1px solid var(--border); border-radius: 12px; background: #fff; padding: 14px 16px; cursor: pointer;
  transition: .2s ease; position: relative; font-size: 1rem; color: var(--text);
}
.option-button:hover { border-color: var(--primary); background: #f7fbff; }
.option-button.correct { background: var(--success-soft); border-color: var(--success); color: #185620; }
.option-button.wrong { background: var(--danger-soft); border-color: var(--danger); color: #8a1d1d; }
.option-button.selected { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0,120,212,.1); }
.option-button:disabled { cursor: default; }
.option-button .letter { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #edf4fb; margin-right: 10px; font-weight: 700; color: var(--primary-dark); }
.option-button.correct .letter, .option-button.wrong .letter { background: rgba(255,255,255,0.35); }

.answer-status { margin-top: 18px; padding: 14px 16px; border-radius: 12px; display: none; font-weight: 700; }
.answer-status.visible { display: block; }
.answer-status.correct { background: var(--success-soft); border: 1px solid rgba(46,125,50,.3); color: var(--success); }
.answer-status.wrong { background: var(--danger-soft); border: 1px solid rgba(198,40,40,.25); color: var(--danger); }

.quiz-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
.quiz-actions .left, .quiz-actions .right { display: flex; gap: 10px; flex-wrap: wrap; }

.result-panel { padding: 28px; text-align: center; }
.result-score { font-size: clamp(2.1rem, 5vw, 3.2rem); font-weight: 800; color: var(--primary-dark); margin: 12px 0; }
.result-message { font-size: 1.2rem; margin: 10px 0 20px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 20px 0; }
.stat-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.stat-box .label { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stat-box .value { font-size: 1.5rem; font-weight: 800; margin-top: 6px; }
.pass { color: var(--success); }
.fail { color: var(--danger); }

@media (max-width: 640px) {
  .topbar { padding: 18px 16px; }
  .quiz-panel, .start-panel, .result-panel { padding: 18px 14px; }
  .question-card { padding: 12px 12px 8px; }
}
</style>
</head>

  <div class="app-shell">
    <header class="topbar">
      <h1>Azure Administrator AZ-104 Practice Quiz</h1>
      <div class="meta">
        <span>Mode: <strong id="header-mode">Full exam</strong></span>
        <span>Question bank: 267</span>
        <span>Pass mark: 70%</span>
      </div>
    </header>

    <main>
      <section id="start-screen" class="screen active card start-panel">
        <h2 id="start-title">Choose your practice mode</h2>
        <div class="mode-grid">
          <button type="button" class="mode-card" data-mode="quick" aria-pressed="false">
            <strong>Quick 10</strong>
            <span>Randomized 10-question warm-up</span>
          </button>
          <button type="button" class="mode-card primary" data-mode="full" aria-pressed="true">
            <strong>Full exam</strong>
            <span>All questions in a realistic full assessment</span>
          </button>
        </div>
        <div class="start-actions">
          <button id="start-quiz-btn" class="primary-button" type="button">Start quiz</button>
        </div>
      </section>

      <section id="quiz-screen" class="screen card quiz-panel">
        <div class="header-row">
          <div id="current-question" class="title">Question 1 of 1</div>
          <div class="pill">Score: <span id="score-value">0 / 0</span></div>
        </div>

        <div class="progress-wrap">
          <div class="progress-meta">
            <span>Progress</span>
            <span id="progress-text">0/0</span>
          </div>
          <div class="progress-bar"><span id="progress-fill"></span></div>
        </div>

        <div class="question-card">
          <h3 id="question-text" class="question-text"></h3>
          <div id="image-grid" class="image-grid"></div>
          <div id="option-list" class="option-list"></div>
        </div>

        <div id="answer-status" class="answer-status"></div>

        <div class="quiz-actions">
          <div class="left">
            <button id="skip-question-btn" class="ghost-button" type="button">Skip question</button>
          </div>
          <div class="right">
            <button id="next-question-btn" class="primary-button" type="button" style="display:none;">Next question</button>
          </div>
        </div>
      </section>

      <section id="result-screen" class="screen card result-panel">
        <div class="result-score"><span id="final-score">0/0</span></div>
        <div id="result-message" class="result-message">Quiz complete.</div>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="label">Correct</div>
            <div id="correct-count" class="value">0</div>
          </div>
          <div class="stat-box">
            <div class="label">Percentage</div>
            <div id="percent-value" class="value">0%</div>
          </div>
          <div class="stat-box">
            <div class="label">Result</div>
            <div id="pass-state" class="value">PASS</div>
          </div>
          <div class="stat-box">
            <div class="label">Questions</div>
            <div id="total-questions" class="value">0</div>
          </div>
        </div>
        <div class="start-actions" style="justify-content:center;">
          <button id="restart-button" class="primary-button" type="button">Restart quiz</button>
        </div>
      </section>
    </main>
  </div>

const state = {
  mode: 'full',
  questionPool: [],
  currentIndex: 0,
  score: 0,
  answerLocked: false,
  selectedIndexes: new Set(),
  totalAnswered: 0
};

const screens = {
  start: document.getElementById('start-screen'),
  quiz: document.getElementById('quiz-screen'),
  result: document.getElementById('result-screen')
};

const els = {
  startTitle: document.getElementById('start-title'),
  modeButtons: [...document.querySelectorAll('[data-mode]')],
  startQuizBtn: document.getElementById('start-quiz-btn'),
  headerMode: document.getElementById('header-mode'),
  currentQuestion: document.getElementById('current-question'),
  progressText: document.getElementById('progress-text'),
  progressFill: document.getElementById('progress-fill'),
  scoreValue: document.getElementById('score-value'),
  questionText: document.getElementById('question-text'),
  imageGrid: document.getElementById('image-grid'),
  optionList: document.getElementById('option-list'),
  answerStatus: document.getElementById('answer-status'),
  nextButton: document.getElementById('next-question-btn'),
  skipButton: document.getElementById('skip-question-btn'),
  restartButton: document.getElementById('restart-button'),
  finalScore: document.getElementById('final-score'),
  resultMessage: document.getElementById('result-message'),
  totalQuestions: document.getElementById('total-questions'),
  correctCount: document.getElementById('correct-count'),
  percentValue: document.getElementById('percent-value'),
  passState: document.getElementById('pass-state')
};

function shuffle(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function setMode(mode) {
  state.mode = mode;
  els.headerMode.textContent = mode === 'quick' ? 'Quick 10' : 'Full exam';
  els.modeButtons.forEach((button) => {
    const active = button.dataset.mode === mode;
    button.classList.toggle('primary', active);
    button.setAttribute('aria-pressed', String(active));
  });
}

function buildQuestionPool() {
  const shuffled = shuffle(QUESTIONS);
  if (state.mode === 'quick') {
    return shuffled.slice(0, 10);
  }
  return shuffled;
}

function startQuiz() {
  state.questionPool = buildQuestionPool();
  state.currentIndex = 0;
  state.score = 0;
  state.totalAnswered = 0;
  screens.start.classList.remove('active');
  screens.result.classList.remove('active');
  screens.quiz.classList.add('active');
  renderCurrentQuestion();
}

function showQuestionScreen() {
  screens.start.classList.remove('active');
  screens.quiz.classList.add('active');
  screens.result.classList.remove('active');
}

function getCurrentQuestion() {
  return state.questionPool[state.currentIndex];
}

function evaluateSelection(selectedIndexes) {
  const question = getCurrentQuestion();
  const correctIndexes = new Set(
    question.options
      .map((option, index) => option.correct ? index : -1)
      .filter(index => index >= 0)
  );
  if (!selectedIndexes.size) {
    return false;
  }
  if (selectedIndexes.size !== correctIndexes.size) {
    return false;
  }
  for (const idx of selectedIndexes) {
    if (!correctIndexes.has(idx)) return false;
  }
  return true;
}

function renderCurrentQuestion() {
  const question = getCurrentQuestion();
  if (!question) {
    showResults();
    return;
  }

  state.answerLocked = false;
  state.selectedIndexes = new Set();
  const total = state.questionPool.length;
  const currentNumber = state.currentIndex + 1;
  const percent = (currentNumber / total) * 100;

  els.currentQuestion.textContent = `Question ${currentNumber} of ${total}`;
  els.progressText.textContent = `${currentNumber}/${total}`;
  els.progressFill.style.width = `${percent}%`;
  els.scoreValue.textContent = `${state.score} / ${state.totalAnswered || 0}`;
  els.questionText.textContent = question.question;
  els.answerStatus.className = 'answer-status';
  els.answerStatus.textContent = '';
  els.nextButton.style.display = 'none';
  els.skipButton.style.display = 'inline-flex';

  // Ensure answer buttons are re-enabled after a skipped question.
  els.optionList.querySelectorAll('.option-button').forEach((button) => {
    button.classList.remove('correct', 'wrong', 'selected');
    button.disabled = false;
  });

  els.imageGrid.innerHTML = '';
  if (question.images && question.images.length) {
    question.images.forEach((imagePath) => {
      const img = document.createElement('img');
      img.src = imagePath;
      img.alt = question.question;
      img.loading = 'lazy';
      els.imageGrid.appendChild(img);
    });
  }

  els.optionList.innerHTML = '';
  question.options.forEach((option, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'option-button';
    button.innerHTML = `<span class="letter">${String.fromCharCode(65 + index)}</span><span>${option.text}</span>`;
    button.addEventListener('click', () => handleOptionClick(index));
    els.optionList.appendChild(button);
  });
}

function markOptions(selectedIndexes, correctIndexes, wasCorrect) {
  const optionButtons = [...els.optionList.querySelectorAll('.option-button')];
  optionButtons.forEach((button, index) => {
    const selected = selectedIndexes.has(index);
    const correct = correctIndexes.has(index);
    button.disabled = true;
    button.classList.toggle('selected', selected);
    if (correct) {
      button.classList.add('correct');
    }
    if (selected && !correct) {
      button.classList.add('wrong');
    }
  });

  const status = els.answerStatus;
  status.classList.add(wasCorrect ? 'correct' : 'wrong');
  status.classList.add('visible');
  status.textContent = wasCorrect ? '✅ Correct answer' : '❌ Incorrect answer';
  els.nextButton.style.display = 'inline-flex';
  els.skipButton.style.display = 'none';
}

function handleOptionClick(index) {
  if (state.answerLocked) {
    return;
  }

  const question = getCurrentQuestion();
  const selected = state.selectedIndexes;

  if (selected.has(index)) {
    selected.delete(index);
  } else {
    selected.add(index);
  }

  const correctIndexes = new Set(
    question.options
      .map((option, optionIndex) => option.correct ? optionIndex : -1)
      .filter(optionIndex => optionIndex >= 0)
  );
  const answerIsCorrect = evaluateSelection(selected);
  const optionButtons = [...els.optionList.querySelectorAll('.option-button')];

  optionButtons.forEach((button, buttonIndex) => {
    const active = selected.has(buttonIndex);
    button.classList.toggle('selected', active);
    if (correctIndexes.has(buttonIndex)) {
      button.classList.add('correct');
    }
    if (active && !correctIndexes.has(buttonIndex)) {
      button.classList.add('wrong');
    }
    button.disabled = true;
  });

  state.answerLocked = true;
  if (!selected.size) {
    // Allow user to choose at least one answer before continuing.
    state.answerLocked = false;
    optionButtons.forEach((button) => button.disabled = false);
    return;
  }

  state.totalAnswered += 1;
  if (answerIsCorrect) {
    state.score += 1;
  }
  els.scoreValue.textContent = `${state.score} / ${state.totalAnswered}`;
  markOptions(selected, correctIndexes, answerIsCorrect);
}

function advanceQuestion() {
  if (state.currentIndex < state.questionPool.length - 1) {
    state.currentIndex += 1;
    renderCurrentQuestion();
  } else {
    showResults();
  }
}

function skipQuestion() {
  if (state.answerLocked) {
    return;
  }
  const activeQuestion = getCurrentQuestion();
  if (!activeQuestion) {
    showResults();
    return;
  }
  state.answerLocked = true;
  const correctIndexes = new Set(
    activeQuestion.options
      .map((option, index) => option.correct ? index : -1)
      .filter(index => index >= 0)
  );
  els.answerStatus.className = 'answer-status visible wrong';
  els.answerStatus.textContent = '⏭️ Question skipped';
  const optionButtons = [...els.optionList.querySelectorAll('.option-button')];
  optionButtons.forEach((button, index) => {
    button.disabled = true;
    if (correctIndexes.has(index)) {
      button.classList.add('correct');
    }
  });
  els.nextButton.style.display = 'inline-flex';
  els.skipButton.style.display = 'none';
}

function showResults() {
  screens.quiz.classList.remove('active');
  screens.result.classList.add('active');
  const total = state.questionPool.length || 1;
  const percent = Math.round((state.score / total) * 100);
  const passed = percent >= 70;

  els.finalScore.textContent = `${state.score}/${total}`;
  els.resultMessage.textContent = passed ? 'You passed the practice exam.' : 'You need more review before the next attempt.';
  els.totalQuestions.textContent = String(total);
  els.correctCount.textContent = String(state.score);
  els.percentValue.textContent = `${percent}%`;
  els.passState.textContent = passed ? 'PASS' : 'FAIL';
  els.passState.className = passed ? 'pass' : 'fail';
}

els.modeButtons.forEach((button) => {
  button.addEventListener('click', () => setMode(button.dataset.mode));
});

els.startQuizBtn.addEventListener('click', startQuiz);
els.nextButton.addEventListener('click', advanceQuestion);
els.skipButton.addEventListener('click', skipQuestion);
els.restartButton.addEventListener('click', () => {
  screens.result.classList.remove('active');
  screens.start.classList.add('active');
  setMode('full');
});

setMode('full');
</script>
